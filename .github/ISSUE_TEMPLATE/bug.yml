name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: rbridge doctor
      description: Output of `rbridge doctor --json`. Check it for anything private before posting.
      render: json
  - type: input
    id: version
    attributes:
      label: rbridge version and platform
      placeholder: rbridge version output, operating system
    validations:
      required: true
